<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Naveed Global Portal</title>

<style>

body{
margin:0;
font-family:Arial;
color:white;
overflow-x:hidden;
background:#000;
}

/* animated background */

.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(45deg,#0f172a,#020617,#1e293b);
animation:move 10s infinite alternate;
z-index:-1;
}

@keyframes move{
0%{filter:hue-rotate(0deg)}
100%{filter:hue-rotate(180deg)}
}

nav{
background:#020617;
padding:15px;
display:flex;
justify-content:space-between;
}

nav a{
color:white;
margin:0 10px;
text-decoration:none;
}

section{
padding:60px;
text-align:center;
}

.card{
background:#1e293b;
padding:20px;
margin:20px;
border-radius:10px;
display:inline-block;
width:250px;
}

button{
padding:12px 20px;
background:#22c55e;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

/* chat box */

#chat{
width:300px;
height:200px;
background:#020617;
overflow:auto;
margin:auto;
padding:10px;
border-radius:10px;
}

input{
padding:10px;
margin:5px;
}

canvas{
background:black;
margin-top:20px;
}

</style>

</head>

<body>

<div class="bg"></div>

<nav>

<div>
<a href="#home">Home</a>
<a href="#game">Game</a>
<a href="#video">Video</a>
<a href="#chatsec">Chat</a>
</div>

<select onchange="changeLang(this.value)">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="ur">Urdu</option>
<option value="fr">French</option>
<option value="es">Spanish</option>
<option value="de">German</option>
<option value="ar">Arabic</option>
<option value="zh">Chinese</option>
<option value="ru">Russian</option>
<option value="ja">Japanese</option>
</select>

</nav>

<section id="home">

<h1 id="title">Welcome to Naveed's Portal</h1>

<p id="intro">
Global website with games, chat and videos.
</p>

<div class="card">
<h3>Projects</h3>
<p>Coding experiments</p>
</div>

<div class="card">
<h3>Gaming</h3>
<p>BGMI content</p>
</div>

<div class="card">
<h3>Movies</h3>
<p>Cinema discussions</p>
</div>

</section>

<section id="video">

<h2>Video</h2>

<iframe width="560" height="315"
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
frameborder="0" allowfullscreen>
</iframe>

</section>

<section id="game">

<h2>Mini Game</h2>

<canvas id="gameCanvas" width="400" height="300"></canvas>

</section>

<section id="chatsec">

<h2>Chat</h2>

<div id="chat"></div>

<input id="msg" placeholder="Type message">
<button onclick="send()">Send</button>

</section>

<section id="login">

<h2>Secret Login</h2>

<input id="user" placeholder="username">
<input id="pass" placeholder="password" type="password">

<button onclick="login()">Login</button>

<p id="loginmsg"></p>

</section>

<script>

/* language system */

const t={
en:{
title:"Welcome to Naveed's Portal",
intro:"Global website with games, chat and videos."
},
hi:{
title:"नवीद के पोर्टल में आपका स्वागत है",
intro:"यह वेबसाइट गेम, चैट और वीडियो के साथ है।"
},
ur:{
title:"نوید کے پورٹل میں خوش آمدید",
intro:"یہ ویب سائٹ گیم، چیٹ اور ویڈیو کے ساتھ ہے۔"
}
};

function changeLang(l){
if(t[l]){
document.getElementById("title").innerText=t[l].title;
document.getElementById("intro").innerText=t[l].intro;
}
}

/* chat */

function send(){

let msg=document.getElementById("msg").value;

let box=document.getElementById("chat");

box.innerHTML+="<p>"+msg+"</p>";

document.getElementById("msg").value="";

}

/* simple game */

let canvas=document.getElementById("gameCanvas");
let ctx=canvas.getContext("2d");

let x=50;

function game(){

ctx.clearRect(0,0,400,300);

ctx.fillStyle="lime";

ctx.fillRect(x,150,20,20);

x+=2;

if(x>400)x=0;

requestAnimationFrame(game);

}

game();

/* login */

function login(){

let u=document.getElementById("user").value;
let p=document.getElementById("pass").value;

if(u=="naveed" && p=="1234"){

document.getElementById("loginmsg").innerText="Access Granted";

}else{

document.getElementById("loginmsg").innerText="Access Denied";

}

}

</script>

</body>
</html>
